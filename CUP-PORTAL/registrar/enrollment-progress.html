<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enrollment Progress</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/CUP-PORTAL/portal-dark.css">
</head>
<body class="bg-slate-50 p-4 text-slate-800">
<div class="space-y-3">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div>
      <h2 class="text-sm font-extrabold uppercase text-slate-700">Enrollment Progress</h2>
      <p id="termLine" class="text-xs text-slate-500">Loading…</p>
    </div>
    <input id="search" type="search" placeholder="Search student no. or name" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs w-64">
  </div>
  <p class="text-xs text-slate-500">Each student pre-registered for the active term, with the status of every enrollment step. ✓ = done, — = still to do.</p>
  <div id="msg" class="text-xs text-rose-600"></div>
  <div style="overflow-x:auto">
    <table class="w-full text-xs bg-white border border-slate-200">
      <thead class="bg-slate-100">
        <tr id="head"></tr>
      </thead>
      <tbody id="rows"><tr><td class="p-2 text-slate-500">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
<script>
(function () {
  var COLLEGE = new URLSearchParams(location.search).get('college') || '';
  var STEP_SHORT = ['Step 1 Grades', 'Step 2 Evaluation', 'Step 2 Advising', 'Step 2 Section', 'Step 3 NSTP', 'Step 4 CUP ID', 'Step 5 CSC', 'Step 6 Advising slip'];
  var data = [];
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function render() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var list = data.filter(function (s) { return !q || (s.student_no + ' ' + s.name).toLowerCase().indexOf(q) !== -1; });
    document.getElementById('head').innerHTML = '<th class="text-left p-2">Student No.</th><th class="text-left p-2">Name</th><th class="text-left p-2">Program</th><th class="text-left p-2">Year-Section</th>' +
      STEP_SHORT.map(function (t) { return '<th class="p-2 text-center whitespace-nowrap">' + esc(t) + '</th>'; }).join('') + '<th class="text-left p-2">Still to do</th>';
    if (!list.length) { document.getElementById('rows').innerHTML = '<tr><td class="p-2 text-slate-500" colspan="13">No students pre-registered for the active term.</td></tr>'; return; }
    document.getElementById('rows').innerHTML = list.map(function (s) {
      return '<tr class="border-t border-slate-200">' +
        '<td class="p-2 font-mono">' + esc(s.student_no) + '</td><td class="p-2">' + esc(s.name) + '</td><td class="p-2">' + esc(s.program) + '</td>' +
        '<td class="p-2">' + esc(s.year_level) + (s.section ? '-' + esc(s.section) : '') + '</td>' +
        s.steps.map(function (st) { return '<td class="p-2 text-center font-bold ' + (st.done ? 'text-emerald-700' : 'text-rose-600') + '">' + (st.done ? '✓' : '—') + '</td>'; }).join('') +
        '<td class="p-2 text-slate-600">' + (s.missing.length ? esc(s.missing.join('; ')) : (s.officially_enrolled ? 'Officially Enrolled' : 'All steps done')) + '</td>' +
        '</tr>';
    }).join('');
  }
  function load() {
    var msg = document.getElementById('msg');
    msg.textContent = '';
    fetch('/api/registrar/enrollment-progress?college=' + encodeURIComponent(COLLEGE), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { msg.textContent = res.j.error || 'Could not load the enrollment progress.'; document.getElementById('rows').innerHTML = ''; return; }
        data = res.j.students || [];
        document.getElementById('termLine').textContent = (res.j.term || '—') + (res.j.academic_year ? ' · A.Y. ' + res.j.academic_year : '') + ' · ' + data.length + ' pre-registered';
        render();
      }).catch(function () { msg.textContent = 'Could not load the enrollment progress.'; });
  }
  document.getElementById('search').addEventListener('input', render);
  load();
})();
</script>
</body>
</html>
