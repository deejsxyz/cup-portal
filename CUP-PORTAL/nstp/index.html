<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUP NSTP Officer Login</title>
<link rel="icon" href="/images/favicon-cup.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  :root { --dg:#0a3a0a; --g:#106010; --gold:#f2c200; --ink:#1f2a1f; --line:#c9ccd1; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: 'Libre Franklin', Arial, Helvetica, sans-serif; min-height: 100vh; }
  [hidden] { display: none !important; }
  .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .left { background: var(--g); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
  .left img { width: 300px; max-width: 90%; height: auto; margin-bottom: 18px; }
  .left h1 { font-size: 1.8rem; font-weight: 800; margin: 0; line-height: 1.2; }
  .left p { font-size: 1.1rem; margin: 10px 0 0; }
  .left a { display: inline-block; margin-top: 22px; background: var(--gold); color: #222; text-decoration: none; font-weight: 700; padding: 12px 36px; border-radius: 4px; }
  .right { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .card { width: 100%; max-width: 380px; }
  h2 { font-size: 1.6rem; font-weight: 600; margin: 0 0 18px; }
  .note { background: #dbeaf7; color: #1e3a5f; border-radius: 4px; padding: 12px 14px; font-size: .95rem; margin-bottom: 16px; }
  label { display: block; font-size: .95rem; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 42px; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px; font: inherit; font-size: 1rem; margin-bottom: 14px; }
  .btn { width: 100%; height: 44px; border: 0; border-radius: 4px; background: var(--g); color: #fff; font: inherit; font-size: 1rem; cursor: pointer; }
  .btn:hover { background: var(--dg); }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-size: .92rem; min-height: 1.3em; margin: 0 0 10px; color: #c62828; }
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; }
    .left { padding: 28px 20px; }
    .left img { width: 220px; }
    .left h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
  <div class="split">
    <div class="left">
      <img src="/images/cup-logo-seal.png" alt="City University of Pasay seal">
      <h1>CUP CENTRAL PORTAL</h1>
      <p>NSTP Portal</p>
      <a href="/CUP-PORTAL/">Back to Home Page</a>
    </div>
    <div class="right">
      <div class="card">
        <h2>Login</h2>
        <div class="note">NSTP Officer login</div>
        <form id="login" novalidate>
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password">
          <button class="btn" type="submit" id="go">Login</button>
          <p class="msg" id="msg" role="status"></p>
        </form>
      </div>
    </div>
  </div>

<script>
(function () {
  var form = document.getElementById('login'), msg = document.getElementById('msg'), btn = document.getElementById('go');

  // Already signed in as the NSTP Officer: go straight to the dashboard.
  fetch('/api/nstp/me', { credentials: 'same-origin' }).then(function (r) {
    if (r.ok) window.location.href = '/CUP-PORTAL/nstp/dashboard';
  }).catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) { msg.textContent = 'Please enter your username and password.'; return; }
    btn.disabled = true;
    fetch('/api/registrar/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password, portal: 'nstp' })
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, data: j }; }); })
      .then(function (res) {
        if (!res.ok) { btn.disabled = false; msg.textContent = res.data.error || 'Could not log in.'; return; }
        if (res.data.must_change) { window.location.href = '/CUP-PORTAL/staff/first-login/?token=' + encodeURIComponent(res.data.token); return; }
        window.location.href = '/CUP-PORTAL/nstp/dashboard';
      }).catch(function () { btn.disabled = false; msg.textContent = 'Could not log in. Please try again.'; });
  });
})();
</script>
<script src="/protect-logo.js"></script>
</body>
</html>
