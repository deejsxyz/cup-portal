<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUP College Registrar Login</title>
<link rel="icon" href="/images/favicon-cup.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>

  :root { --dg:#0a3a0a; --g:#106010; --g2:#106010; --gold:#f2c200; --ink:#1f2a1f; --line:#c9ccd1; --blue:#1a73e8; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: 'Libre Franklin', Arial, Helvetica, sans-serif; min-height: 100vh; }
  .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .left { background: var(--g); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
  .left img { width: 375px; max-width: 90%; height: auto; margin-bottom: 18px; }
  .left h1 { font-size: 1.9rem; font-weight: 800; margin: 0; line-height: 1.2; }
  .left p { font-size: 1.15rem; margin: 10px 0 26px; }
  .left a { display: inline-block; background: var(--gold); color: #222; text-decoration: none; font-weight: 700; padding: 12px 36px; border-radius: 4px; }
  .right { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .card { width: 100%; max-width: 380px; }
  h2 { font-size: 1.6rem; font-weight: 600; margin: 0 0 18px; }
  .note { background: #dbeaf7; color: #1e3a5f; border-radius: 4px; padding: 14px 16px; font-size: .98rem; margin-bottom: 16px; }
  label { display: block; font-size: .95rem; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 42px; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px; font: inherit; font-size: 1rem; margin-bottom: 14px; }
  .btn { width: 100%; height: 44px; border: 0; border-radius: 4px; background: var(--g); color: #fff; font: inherit; font-size: 1rem; cursor: pointer; }
  .btn:hover { background: var(--dg); }
  .msg { font-size: .92rem; min-height: 1.3em; margin: 0 0 10px; color: #c62828; }
  .links { margin-top: 16px; font-size: .95rem; }
  .links button { background: none; border: 0; padding: 0; font: inherit; color: var(--blue); cursor: pointer; text-decoration: underline; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; z-index: 10; }
  .modal { background: #fff; width: 100%; max-width: 380px; border-radius: 8px; padding: 24px; box-sizing: border-box; position: relative; text-align: left; }
  .modal h2 { font-size: 1.2rem; margin: 0 0 14px; color: var(--green); }
  .modal .x { position: absolute; top: 8px; right: 12px; background: none; border: 0; font-size: 1.5rem; cursor: pointer; color: #555; }
  .modal .msg { text-align: left; }
  .modal .ok { color: var(--green); }
  [hidden] { display: none !important; }
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; }
    .left { padding: 32px 20px 28px; }
    .left img { width: 240px; }
    .left h1 { font-size: 1.4rem; }
  }
  .modal .x { position: absolute; top: 8px; right: 12px; background: none; border: 0; font-size: 1.5rem; cursor: pointer; color: #555; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; z-index: 10; }
  .modal { background: #fff; width: 100%; max-width: 380px; border-radius: 8px; padding: 24px; box-sizing: border-box; position: relative; text-align: left; border-top: 6px solid var(--gold); }
  .modal h2 { font-size: 1.2rem; margin: 0 0 14px; color: var(--dg); }
  .modal .x { position: absolute; top: 8px; right: 12px; background: none; border: 0; font-size: 1.5rem; cursor: pointer; color: #555; }
  .modal .note { background: #dbeaf7; color: #1e3a5f; border-radius: 4px; padding: 12px 14px; font-size: .92rem; margin-bottom: 8px; }
  .modal .msg { text-align: left; }
  [hidden] { display: none !important; }
  .modal h2 { font-size: 1.2rem; margin: 0 0 14px; color: var(--g); }
  .modal .note { background: #dbeaf7; color: #1e3a5f; border-radius: 4px; padding: 12px 14px; font-size: .92rem; margin-bottom: 8px; }
  .modal .msg { text-align: left; }
  .msg.ok { color: var(--g); }
</style>
<link rel="stylesheet" href="/CUP-PORTAL/portal-controls.css">
</head>
<body>
  <div class="split">
    <div class="left">
      <img src="/images/cup-logo-seal.png" alt="City University of Pasay seal">
      <h1>CUP CENTRAL PORTAL</h1>
      <p id="pageSub">College Registrar</p>
      <a href="/CUP-PORTAL/">Back to Home Page</a>
    </div>
    <div class="right">
      <div class="card">
        <h2>Login</h2>
        <div class="note">College Registrar login</div>
        <form id="login" novalidate>
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password">
          <button class="btn" type="submit" id="go">Login</button>
          <p class="msg" id="msg" role="status"></p>
        </form>
        <div class="links"><button type="button" id="forgot-open">Forgot Password</button></div>
      </div>
    </div>
  </div>

  <!-- Forgot password popup -->
  <div class="overlay" id="forgot-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="forgot-title">
      <button class="x" type="button" id="forgot-close" aria-label="Close">&times;</button>
      <h2 id="forgot-title">Forgot Password</h2>

      <!-- Step 1: email -->
      <form id="step-email" novalidate>
        <label for="f-email">Email</label>
        <input id="f-email" type="email" autocomplete="email" pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}" maxlength="254" title="Enter a valid email address, for example name@example.com">
        <p class="msg" id="f-email-msg" role="status"></p>
        <button class="btn" type="submit" id="f-send">Send OTP</button>
      </form>

      <!-- Step 2: OTP -->
      <form id="step-otp" novalidate hidden>
        <div class="note">We've sent a verification code to your registered email.</div>
        <label for="f-otp">OTP</label>
        <input id="f-otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
        <p class="msg" id="f-otp-msg" role="status"></p>
        <button class="btn" type="submit" id="f-verify">Verify OTP</button>
      </form>

      <!-- Step 3: new password -->
      <form id="step-pass" novalidate hidden>
        <label for="f-pass">New Password</label>
        <input id="f-pass" type="password" autocomplete="new-password">
        <label for="f-confirm">Confirm Password</label>
        <input id="f-confirm" type="password" autocomplete="new-password">
        <p class="msg" id="f-pass-msg" role="status"></p>
        <button class="btn" type="submit" id="f-change">Change Password</button>
      </form>
    </div>
  </div>

<script>
  (function () {
    var form = document.getElementById('login'), msg = document.getElementById('msg'), btn = document.getElementById('go');
    // No auto-redirect: a session in this browser is shared, so the login form always opens.
    }).catch(function () {});
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.textContent = '';
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      if (!username || !password) { msg.textContent = 'Please enter your username and password.'; return; }
      btn.disabled = true;
      fetch('/api/registrar/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password, portal: 'college', college: new URLSearchParams(window.location.search).get('college') || '' })
      }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, data: j }; }); })
        .then(function (res) {
          if (!res.ok) { btn.disabled = false; msg.textContent = res.data.error || 'Could not log in.'; return; }
          if (res.data.must_change) { window.location.href = '/CUP-PORTAL/staff/first-login/?token=' + encodeURIComponent(res.data.token); return; }
          try { sessionStorage.setItem("cupPortalTab", "1"); } catch (e) {}
          window.location.href = (res.data.role === 'superadmin') ? '/CUP-PORTAL/registrar/dashboard' : '/CUP-PORTAL/college-registrar/dashboard';
        }).catch(function () { btn.disabled = false; msg.textContent = 'Could not log in. Please try again.'; });
    });
  })();
</script>
<script>
  // Forgot password popup: email -> OTP -> verify -> new password.
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var overlay = $('forgot-overlay');
    var stepEmail = $('step-email'), stepOtp = $('step-otp'), stepPass = $('step-pass');
    var fEmail = $('f-email'), fOtp = $('f-otp'), fPass = $('f-pass'), fConfirm = $('f-confirm');
    var emailMsg = $('f-email-msg'), otpMsg = $('f-otp-msg'), passMsg = $('f-pass-msg');
    var sendBtn = $('f-send'), verifyBtn = $('f-verify'), changeBtn = $('f-change');
    var email = '';
    var NOT_REGISTERED = 'User not registered. Contact the Administrator.';

    function post(url, body) {
      return fetch(url, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, ok: r.ok, data: d }; }); });
    }
    function show(el, text) { el.textContent = text; }
    function showStep(step) {
      stepEmail.hidden = step !== 'email';
      stepOtp.hidden = step !== 'otp';
      stepPass.hidden = step !== 'pass';
    }
    function open() {
      email = '';
      fEmail.value = ''; fOtp.value = ''; fPass.value = ''; fConfirm.value = '';
      show(emailMsg, ''); show(otpMsg, ''); show(passMsg, '');
      showStep('email');
      overlay.hidden = false;
      fEmail.focus();
    }
    function close() { overlay.hidden = true; }

    $('forgot-open').addEventListener('click', open);
    $('forgot-close').addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });

    // Step 1: send OTP only to a registered email
    stepEmail.addEventListener('submit', function (e) {
      e.preventDefault();
      show(emailMsg, '');
      email = fEmail.value.trim().toLowerCase();
      if (!email) { show(emailMsg, 'Please enter your email address.'); return; }
      sendBtn.disabled = true;
      post('/api/cat/reset/request', { email: email }).then(function (res) {
        sendBtn.disabled = false;
        if (res.status === 404) { show(emailMsg, NOT_REGISTERED); return; }
        if (!res.ok) { show(emailMsg, res.data.error || 'Could not send the OTP. Please try again.'); return; }
        showStep('otp');
        fOtp.focus();
      }).catch(function () {
        sendBtn.disabled = false;
        show(emailMsg, 'Could not send the OTP. Please try again.');
      });
    });

    // Step 2: verify the OTP
    stepOtp.addEventListener('submit', function (e) {
      e.preventDefault();
      show(otpMsg, '');
      var otp = fOtp.value.trim();
      if (!/^\d{6}$/.test(otp)) { show(otpMsg, 'Enter the 6-digit OTP.'); return; }
      verifyBtn.disabled = true;
      post('/api/cat/reset/verify', { email: email, otp: otp }).then(function (res) {
        verifyBtn.disabled = false;
        if (!res.ok) { show(otpMsg, res.data.error || 'The OTP is incorrect.'); return; }
        showStep('pass');
        fPass.focus();
      }).catch(function () {
        verifyBtn.disabled = false;
        show(otpMsg, 'Could not verify the OTP. Please try again.');
      });
    });

    // Step 3: new password
    stepPass.addEventListener('submit', function (e) {
      e.preventDefault();
      show(passMsg, '');
      var pass = fPass.value;
      if (pass.length < 8) { show(passMsg, 'Password must be at least 8 characters.'); return; }
      if (pass !== fConfirm.value) { show(passMsg, 'The passwords do not match.'); return; }
      changeBtn.disabled = true;
      post('/api/cat/reset/confirm', { email: email, password: pass }).then(function (res) {
        changeBtn.disabled = false;
        if (!res.ok) { show(passMsg, res.data.error || 'Could not change the password.'); return; }
        close();
        show(document.getElementById('msg'), '');
        var ok = document.getElementById('msg');
        ok.classList.add('ok');
        ok.textContent = 'Your password has been changed. You can log in now.';
      }).catch(function () {
        changeBtn.disabled = false;
        show(passMsg, 'Could not change the password. Please try again.');
      });
    });
  })();
</script>
<script>
  // The college chosen on the portal home page shows as the title, e.g. CONM REGISTRAR.
  (function () {
    var names = { COACS: 'COACS', CAS: 'CAS', CONM: 'CONM', COED: 'COED', COBM: 'COBM', LAW: 'SCHOOL OF LAW', GS: 'GRADUATE SCHOOL', 'TESDA-TVI': 'TESDA-TVI' };
    var code = new URLSearchParams(window.location.search).get('college');
    if (code && names[code]) {
      document.getElementById('pageSub').textContent = names[code] + ' Registrar';
      document.title = names[code] + ' Registrar Login';
    }
  })();
</script>
</body>
</html>
