<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUP ID System · Photo capture</title>
<style>
  [hidden] { display: none !important; }
  :root { --green: #106010; --dg: #0b4a0b; --gold: #f2c200; --line: #d6dbd6; --bad: #b42318; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f6f4; color: #222; font-family: Arial, Helvetica, sans-serif; min-height: 100vh; }
  header { background: var(--green); color: #fff; padding: 12px 16px; border-bottom: 4px solid var(--gold); }
  header h1 { font-size: 1rem; margin: 0; }
  header p { margin: 4px 0 0; color: var(--gold); font-weight: 700; font-size: .85rem; }
  main { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  h2 { font-size: .95rem; margin: 0 0 10px; color: var(--dg); text-transform: uppercase; letter-spacing: .04em; }
  video, img, canvas { width: 100%; max-width: 480px; border-radius: 6px; display: block; background: #e6ece6; aspect-ratio: 1 / 1; object-fit: cover; margin: 0 auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { border: 0; border-radius: 4px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; background: var(--gold); color: #222; }
  button.light { background: #fff; color: var(--green); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: .9rem; min-height: 1.2em; margin: 10px 0 0; color: var(--bad); }
  .msg.ok { color: var(--green); }
  .hint { color: #6b7280; font-size: .85rem; margin: 0 0 10px; }
  .idcard { width: 100%; max-width: 240px; aspect-ratio: 54 / 85.6; margin: 0 auto; border-radius: 12px; border: 2px solid var(--green); background: linear-gradient(170deg, #fff 0%, #eef6ee 100%); position: relative; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .idcard.front-tpl { background: url('/CUP-PORTAL/id/front-design.png') center / cover no-repeat; border-color: var(--green); }
  .idcard .f-photo { position: absolute; left: 32.9%; top: 39.2%; width: 34.2%; height: 24.9%; background: #fff center/cover no-repeat; border: 1px solid #555; }
  .idcard .f-name, .idcard .f-no { position: absolute; left: 6%; right: 6%; text-align: center; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idcard .f-name { bottom: 25.2%; height: 4%; font-size: .9rem; display: flex; align-items: flex-end; justify-content: center; }
  .idcard .f-no { bottom: 15.9%; height: 4%; font-size: .82rem; display: flex; align-items: flex-end; justify-content: center; }
  .idcard .f-prog { position: absolute; left: 24%; right: 4%; top: 89.8%; height: 8.2%; color: #fff; -webkit-text-stroke: 1px #000; paint-order: stroke fill; font-weight: 700; font-size: .9rem; line-height: 1.1; display: flex; align-items: center; justify-content: center; text-align: center; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>CUP ID SYSTEM · PHOTO CAPTURE</h1>
  <p id="who"></p>
</header>
<main>
  <section class="panel">
    <h2>Live camera</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>
    <div class="row">
      <button class="light" id="start" type="button" hidden>Start camera</button>
      <button id="take" type="button" hidden>Capture</button>
      <button class="light" id="retake" type="button" hidden>Retake</button>
      <button id="save" type="button" hidden>Save photo</button>
    </div>
    <p class="msg" id="msg"></p>
  </section>
  <section class="panel">
    <h2>ID preview</h2>
    <div id="pFront" class="idcard front-tpl" aria-label="ID front">
      <div class="f-photo" id="pPhoto"></div>
      <div class="f-name" id="pName"></div>
      <div class="f-no" id="pNo"></div>
      <div class="f-prog" id="pProgram"></div>
    </div>
  </section>
</main>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var params = new URLSearchParams(window.location.search);
  var no = '';
  var stream = null;
  var captured = null;
  var bc = ('BroadcastChannel' in window) ? new BroadcastChannel('cup-id-sync') : null;

  function setMsg(text, ok) { $('msg').className = ok ? 'msg ok' : 'msg'; $('msg').textContent = text; }

  function cardName(s) {
    var first = String(s.first_name || '').trim();
    var mi = String(s.middle_name || '').trim().charAt(0);
    var parts = [first, mi ? mi + '.' : '', String(s.last_name || '').trim(), String(s.name_extension || '').trim()];
    return parts.filter(Boolean).join(' ').toUpperCase();
  }
  var FRONT_TPL = {
    COACS: 'COACS.jpg', CAS: 'CAS.jpg', CONM: 'CONM.jpg', COED: 'COED.jpg',
    COBM: 'COBM.jpg', LAW: 'LAW.jpg', 'TESDA-TVI': 'TESDA.jpg'
  };
  function frontTemplate(college) {
    var f = FRONT_TPL[college];
    return f ? "url('/CUP-PORTAL/id/Front%20ID/" + f + "')" : "url('/CUP-PORTAL/id/front-design.png')";
  }
  function setPreviewPhoto(url) {
    $('pPhoto').style.backgroundImage = url ? 'url("' + url + '")' : 'none';
  }

  function stopCam() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } }
  function showCaptureButtons(captureMode) {
    $('take').hidden = !captureMode;
    $('retake').hidden = true;
    $('save').hidden = true;
  }
  function startCam() {
    setMsg('', false);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setMsg('This browser cannot open the camera.', false); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }).then(function (s) {
      stream = s;
      $('video').srcObject = s;
      $('video').hidden = false;
      $('start').hidden = true;
      showCaptureButtons(true);
    }).catch(function (e) {
      $('start').hidden = false;
      setMsg('Camera not available: ' + (e && e.name ? e.name : 'unknown error') + '. Allow camera access for this site and close other apps using the camera.', false);
    });
  }
  function resumeCam() {
    if (stream) {
      $('video').hidden = false;
      $('video').play();
      showCaptureButtons(true);
    } else {
      startCam();
    }
  }

  function clearPreview() {
    no = '';
    captured = null;
    stopCam();
    $('video').hidden = true;
    $('start').hidden = true;
    showCaptureButtons(false);
    $('who').textContent = 'No student selected';
    $('pFront').style.backgroundImage = frontTemplate('');
    $('pName').textContent = '';
    $('pNo').textContent = '';
    $('pProgram').textContent = '';
    setPreviewPhoto(null);
    setMsg('Choose a student on the ID page.', false);
  }

  function loadStudent(n) {
    if (n === no) return;
    no = n;
    captured = null;
    setMsg('', false);
    showCaptureButtons(false);
    fetch('/api/id/student/' + encodeURIComponent(n), { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { setMsg('Your ID System session has ended. Log in again on the ID page.', false); return null; }
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res || no !== n) return;
      if (!res.ok) { setMsg(res.j.error || 'Could not load the student.', false); return; }
      var s = res.j.student;
      $('who').textContent = [s.last_name + ',', s.first_name, s.middle_name].filter(Boolean).join(' ') + ' · ' + s.student_no;
      $('pFront').style.backgroundImage = frontTemplate(s.college);
      $('pName').textContent = cardName(s);
      $('pNo').textContent = s.student_no;
      $('pProgram').textContent = String(s.program || '').replace(/\s*\([^)]*\)\s*$/, '');
      setPreviewPhoto(s.photo);
      resumeCam();
    });
  }

  if (bc) bc.onmessage = function (e) {
    var n = (e.data && e.data.no) || '';
    if (!n) clearPreview(); else loadStudent(n);
  };

  $('start').addEventListener('click', startCam);
  $('take').addEventListener('click', function () {
    var v = $('video'), c = $('canvas');
    var side = Math.min(v.videoWidth, v.videoHeight);
    c.width = side; c.height = side;
    c.getContext('2d').drawImage(v, (v.videoWidth - side) / 2, (v.videoHeight - side) / 2, side, side, 0, 0, side, side);
    captured = c.toDataURL('image/jpeg', 0.85);
    setPreviewPhoto(captured);
    v.pause();
    $('take').hidden = true;
    $('retake').hidden = false;
    $('save').hidden = false;
  });
  $('retake').addEventListener('click', function () {
    captured = null;
    setMsg('', false);
    $('video').play();
    $('retake').hidden = true;
    $('save').hidden = true;
    $('take').hidden = false;
    if (no) {
      fetch('/api/id/student/' + encodeURIComponent(no), { credentials: 'same-origin' }).then(function (r) { return r.json(); })
        .then(function (j) { if (j.student && no) setPreviewPhoto(j.student.photo); }).catch(function () {});
    }
  });
  $('save').addEventListener('click', function () {
    var photo = captured;
    if (!photo) { setMsg('Capture a photo first.', false); return; }
    var n = no;
    $('save').disabled = true;
    fetch('/api/id/student/' + encodeURIComponent(n) + '/photo', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ photo: photo })
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        $('save').disabled = false;
        if (res.status === 401) { setMsg('Your ID System session has ended. Log in again on the ID page.', false); return; }
        if (!res.ok) { setMsg(res.j.error || 'Could not save the photo.', false); return; }
        if (bc) bc.postMessage({ photo: { no: n, url: photo } });
        if (window.opener && !window.opener.closed && typeof window.opener.cupIdPhotoSaved === 'function') {
          window.opener.cupIdPhotoSaved(n, photo);
        }
        captured = null;
        setPreviewPhoto(photo);
        setMsg('Photo saved.', true);
      })
      .catch(function () { $('save').disabled = false; setMsg('Could not reach the server. Try again.', false); });
  });
  window.addEventListener('beforeunload', stopCam);

  var initial = params.get('no') || '';
  if (initial) loadStudent(initial); else clearPreview();
})();
</script>
</body>
</html>
