<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUP ID System Login</title>
<link rel="icon" href="/images/favicon-cup.png">
<style>
  :root { --dg:#0a3a0a; --g:#106010; --gold:#f2c200; --ink:#1f2a1f; --line:#c9ccd1; }
  html, body { margin: 0; background: #f4f6f4; color: var(--ink); font-family: Arial, Helvetica, sans-serif; min-height: 100vh; }
  [hidden] { display: none !important; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  .card { background: #fff; width: 100%; max-width: 380px; border-radius: 8px; border-top: 6px solid var(--gold); box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 28px 24px; box-sizing: border-box; }
  h1 { font-size: 1.3rem; color: var(--g); margin: 0 0 4px; }
  .sub { color: #5a6b5a; font-size: .95rem; margin: 0 0 18px; }
  label { display: block; font-size: .9rem; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 42px; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px; font: inherit; margin-bottom: 14px; }
  .btn { width: 100%; height: 44px; border: 0; border-radius: 4px; background: var(--g); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .btn:hover { background: var(--dg); }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-size: .92rem; min-height: 1.3em; margin: 0 0 10px; color: #b42318; }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>CUP ID System</h1>
    <p class="sub">City University of Pasay · ID creation</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="msg" id="msg"></p>
    <button class="btn" id="loginBtn" type="submit">Log in</button>
  </form>
</div>
<script>
(function () {
  var msg = document.getElementById('msg');
  var btn = document.getElementById('loginBtn');
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    fetch('/api/id/login', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) { window.location.href = '/CUP-PORTAL/id/dashboard.html'; return; }
        msg.textContent = res.j.error || 'Could not log in. Please try again.';
        btn.disabled = false;
      })
      .catch(function () { msg.textContent = 'Could not reach the server. Please try again.'; btn.disabled = false; });
  });
})();
</script>
</body>
</html>
